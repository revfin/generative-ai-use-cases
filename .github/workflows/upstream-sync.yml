name: upstream-sync
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main from aws-samples upstream
        run: gh repo sync ${{ github.repository }} --source aws-samples/generative-ai-use-cases --branch main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
